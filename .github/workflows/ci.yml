name: ci

on:
  push:
    branches: ["main", "mod-*"]
  pull_request:

jobs:
  check:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: cargo check (fast)
        run: ./build-mod.sh check
      - name: shellcheck install.sh
        run: |
          brew install shellcheck 2>/dev/null || true
          shellcheck install.sh launch-tier2.sh launch-us-proxy.sh bin/oc-go-key 2>&1 | head -n 100 || true
